<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>出席管理用 QRコード生成ツール</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Meiryo', sans-serif;
      background: #f0f4f8;
      color: #2d3748;
      min-height: 100vh;
      padding: 24px 16px 48px;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }
    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #1a365d;
      letter-spacing: 0.02em;
    }
    header p {
      margin-top: 6px;
      font-size: 0.85rem;
      color: #718096;
    }

    /* ─── Steps ─────────────────────────────────── */
    .steps {
      display: flex;
      justify-content: center;
      gap: 0;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }
    .step {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: #a0aec0;
      font-weight: 600;
    }
    .step.active { color: #2b6cb0; }
    .step.done   { color: #38a169; }
    .step-num {
      width: 26px; height: 26px;
      border-radius: 50%;
      border: 2px solid currentColor;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.78rem;
      flex-shrink: 0;
    }
    .step.done .step-num { background: #38a169; color: #fff; border-color: #38a169; }
    .step.active .step-num { background: #2b6cb0; color: #fff; border-color: #2b6cb0; }
    .step-arrow {
      color: #cbd5e0;
      font-size: 1rem;
      padding: 0 8px;
    }

    /* ─── Card ───────────────────────────────────── */
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      padding: 28px 24px;
      max-width: 520px;
      margin: 0 auto 24px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid #ebf8ff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-title .badge {
      background: #2b6cb0;
      color: #fff;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 99px;
      font-weight: 600;
    }

    /* ─── Form ───────────────────────────────────── */
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 6px;
    }
    label .required {
      color: #e53e3e;
      margin-left: 2px;
    }
    input[type="text"], select {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #2d3748;
      background: #f7fafc;
      transition: border-color 0.15s, box-shadow 0.15s;
      -webkit-appearance: none;
      appearance: none;
      font-family: inherit;
    }
    input[type="text"]:focus, select:focus {
      outline: none;
      border-color: #4299e1;
      box-shadow: 0 0 0 3px rgba(66,153,225,0.18);
      background: #fff;
    }
    .select-wrap {
      position: relative;
    }
    .select-wrap::after {
      content: '▾';
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #718096;
      pointer-events: none;
      font-size: 0.9rem;
    }
    select { padding-right: 32px; cursor: pointer; }

    /* ─── Generate button ────────────────────────── */
    .btn-generate {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #2b6cb0, #4299e1);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: opacity 0.15s, transform 0.1s;
      margin-top: 4px;
      font-family: inherit;
    }
    .btn-generate:hover  { opacity: 0.92; }
    .btn-generate:active { transform: scale(0.98); }

    /* ─── Result card ────────────────────────────── */
    #result-card { display: none; }

    .qr-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    #qrcode {
      display: flex;
      justify-content: center;
    }
    #qrcode canvas, #qrcode img {
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    .qr-info {
      text-align: center;
      font-size: 0.88rem;
      color: #4a5568;
      line-height: 1.7;
      background: #f7fafc;
      border-radius: 8px;
      padding: 12px 16px;
      width: 100%;
    }
    .qr-info .info-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: #1a365d;
    }

    /* ─── Download button ────────────────────────── */
    .btn-download {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #276749, #38a169);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: opacity 0.15s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: inherit;
    }
    .btn-download:hover  { opacity: 0.92; }
    .btn-download:active { transform: scale(0.98); }
    .btn-download svg { flex-shrink: 0; }

    /* ─── JSON preview ───────────────────────────── */
    .json-preview {
      background: #1a202c;
      color: #68d391;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 0.78rem;
      font-family: 'Consolas', 'Courier New', monospace;
      word-break: break-all;
      width: 100%;
      margin-top: 4px;
    }
    .json-label {
      font-size: 0.75rem;
      color: #718096;
      margin-bottom: 4px;
      font-weight: 600;
    }

    /* ─── Responsive ─────────────────────────────── */
    @media (max-width: 480px) {
      header h1 { font-size: 1.3rem; }
      .card { padding: 20px 16px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>出席管理用 QRコード生成ツール</h1>
    <p>学生情報を入力してQRコードを生成・ダウンロードできます</p>
  </header>

  <div class="steps">
    <div class="step active" id="step1">
      <div class="step-num">1</div>
      <span>情報入力</span>
    </div>
    <div class="step-arrow">→</div>
    <div class="step" id="step2">
      <div class="step-num">2</div>
      <span>QR生成</span>
    </div>
    <div class="step-arrow">→</div>
    <div class="step" id="step3">
      <div class="step-num">3</div>
      <span>ダウンロード</span>
    </div>
  </div>

  <!-- ライブラリ読み込み失敗時のバナー -->
  <div id="qr-lib-error" style="display:none;max-width:520px;margin:0 auto 12px;padding:12px 18px;background:#fed7d7;color:#c53030;border-radius:10px;font-size:0.85rem;text-align:center;">
    ⚠ QRコードライブラリの読み込みに失敗しました。インターネット接続を確認してページを再読み込みしてください。
  </div>

  <!-- STEP 1: Form -->
  <div class="card" id="form-card">
    <div class="card-title">
      <span class="badge">STEP 1</span>学生情報を入力
    </div>

    <form id="qr-form" novalidate>
      <div class="form-group">
        <label for="year">年度<span class="required">*</span></label>
        <div class="select-wrap">
          <select id="year" required>
            <option value="">選択してください</option>
            <option value="2026">2026年度</option>
            <option value="2027">2027年度</option>
            <option value="2028">2028年度</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="faculty">学部<span class="required">*</span></label>
        <input type="text" id="faculty" placeholder="例：経済学部" required>
      </div>

      <div class="form-group">
        <label for="grade">学年<span class="required">*</span></label>
        <div class="select-wrap">
          <select id="grade" required>
            <option value="">選択してください</option>
            <option value="1">1年</option>
            <option value="2">2年</option>
            <option value="3">3年</option>
            <option value="4">4年</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="student-id">学籍番号<span class="required">*</span></label>
        <input type="text" id="student-id" placeholder="例：K2240001" required>
      </div>

      <div class="form-group">
        <label for="name">氏名<span class="required">*</span></label>
        <input type="text" id="name" placeholder="例：栗田匡相" required>
      </div>

      <button type="submit" class="btn-generate">QRコードを生成する</button>
    </form>
  </div>

  <!-- STEP 2 & 3: Result -->
  <div class="card" id="result-card">
    <div class="card-title">
      <span class="badge" style="background:#38a169">STEP 2-3</span>生成結果・ダウンロード
    </div>

    <div class="qr-wrapper">
      <div id="qrcode"></div>

      <div class="qr-info">
        <div class="info-name" id="info-name"></div>
        <div id="info-detail"></div>
      </div>

      <div style="width:100%">
        <div class="json-label">埋め込みデータ（JSON）</div>
        <div class="json-preview" id="json-preview"></div>
      </div>

      <button class="btn-download" id="btn-download">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        PNGでダウンロード
      </button>

      <button class="btn-generate" id="btn-reset" style="margin-top:0; background:linear-gradient(135deg,#4a5568,#718096)">
        ← 別の学生のQRを生成する
      </button>
    </div>
  </div>

  <!-- qrcode.js: jsdelivr を優先、失敗時は unpkg からロード -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"
          onerror="loadQRFallback()"></script>
  <script>
  function loadQRFallback() {
    var s = document.createElement('script');
    s.src = 'https://unpkg.com/qrcodejs@1.0.0/qrcode.min.js';
    s.onerror = function() {
      document.getElementById('qr-lib-error').style.display = 'block';
    };
    document.head.appendChild(s);
  }
  </script>

  <script>
  let qrLibReady = false;
  window.addEventListener('load', () => { qrLibReady = typeof QRCode !== 'undefined'; });

  // ─── State ────────────────────────────────────────────────────────────────
  let currentData = null;

  // ─── DOM refs ─────────────────────────────────────────────────────────────
  const form       = document.getElementById('qr-form');
  const formCard   = document.getElementById('form-card');
  const resultCard = document.getElementById('result-card');
  const qrcodeDiv  = document.getElementById('qrcode');
  const infoName   = document.getElementById('info-name');
  const infoDetail = document.getElementById('info-detail');
  const jsonPrev   = document.getElementById('json-preview');
  const btnDl      = document.getElementById('btn-download');
  const btnReset   = document.getElementById('btn-reset');

  const step1 = document.getElementById('step1');
  const step2 = document.getElementById('step2');
  const step3 = document.getElementById('step3');

  // ─── Form submit ──────────────────────────────────────────────────────────
  form.addEventListener('submit', e => {
    e.preventDefault();

    const year    = document.getElementById('year').value.trim();
    const faculty = document.getElementById('faculty').value.trim();
    const grade   = document.getElementById('grade').value.trim();
    const id      = document.getElementById('student-id').value.trim();
    const name    = document.getElementById('name').value.trim();

    if (!year || !faculty || !grade || !id || !name) {
      alert('すべての項目を入力してください。');
      return;
    }

    if (typeof QRCode === 'undefined') {
      alert('QRコードライブラリの読み込みに失敗しました。\nインターネット接続を確認して再読み込みしてください。');
      return;
    }

    currentData = { year, faculty, grade, id, name };
    generateQR(currentData);
  });

  // ─── Generate ─────────────────────────────────────────────────────────────
  function generateQR(data) {
    // clear previous
    qrcodeDiv.innerHTML = '';

    const json = JSON.stringify(data);

    // Show info
    infoName.textContent   = data.name;
    infoDetail.textContent =
      `学籍番号：${data.id}　／　${data.faculty}　${data.grade}年　${data.year}年度`;
    jsonPrev.textContent   = json;

    // Generate QR (250x250)
    new QRCode(qrcodeDiv, {
      text:         json,
      width:        250,
      height:       250,
      colorDark:    '#1a202c',
      colorLight:   '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });

    // Show result card
    formCard.style.display   = 'none';
    resultCard.style.display = 'block';

    // Update steps
    step1.className = 'step done';
    step2.className = 'step done';
    step3.className = 'step active';

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ─── Download ─────────────────────────────────────────────────────────────
  btnDl.addEventListener('click', () => {
    const data = currentData;
    if (!data) return;

    // Find the canvas from qrcodejs (it appends a canvas or img)
    const qrCanvas = qrcodeDiv.querySelector('canvas');
    if (!qrCanvas) {
      alert('QRコードの取得に失敗しました。再生成してください。');
      return;
    }

    // Build output canvas: QR (250) + text area below
    const padding    = 16;
    const qrSize     = 250;
    const lineHeight = 22;
    const lines = [
      data.name,
      `学籍番号：${data.id}`,
      `${data.faculty}　${data.grade}年`,
      `${data.year}年度`
    ];
    const textAreaH  = padding + lines.length * lineHeight + padding;
    const totalW     = qrSize + padding * 2;
    const totalH     = padding + qrSize + textAreaH;

    const canvas = document.createElement('canvas');
    // 2x for retina
    const scale  = 2;
    canvas.width  = totalW  * scale;
    canvas.height = totalH  * scale;
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);

    // Background
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, totalW, totalH);

    // QR code
    ctx.drawImage(qrCanvas, padding, padding, qrSize, qrSize);

    // Text area background
    ctx.fillStyle = '#f0f4f8';
    ctx.fillRect(0, padding + qrSize, totalW, textAreaH);

    // Divider
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth   = 1;
    ctx.beginPath();
    ctx.moveTo(0, padding + qrSize);
    ctx.lineTo(totalW, padding + qrSize);
    ctx.stroke();

    // Text
    ctx.textAlign    = 'center';
    ctx.fillStyle    = '#2d3748';
    lines.forEach((line, i) => {
      const isBig = i === 0;
      ctx.font = isBig
        ? `bold 14px "Hiragino Kaku Gothic ProN","Meiryo",sans-serif`
        : `12px "Hiragino Kaku Gothic ProN","Meiryo",sans-serif`;
      ctx.fillStyle = isBig ? '#1a365d' : '#4a5568';
      ctx.fillText(line, totalW / 2, padding + qrSize + padding + i * lineHeight + (isBig ? 14 : 12));
    });

    // Download
    const link = document.createElement('a');
    link.download = `QR_${data.id}_${data.name}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  // ─── Reset ────────────────────────────────────────────────────────────────
  btnReset.addEventListener('click', () => {
    currentData = null;
    resultCard.style.display = 'none';
    formCard.style.display   = 'block';

    step1.className = 'step active';
    step2.className = 'step';
    step3.className = 'step';

    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  </script>
</body>
</html>
